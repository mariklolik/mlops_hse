apiVersion: v1
kind: ConfigMap
metadata:
  name: torch-benchmark-script
  namespace: gpu-lab
data:
  benchmark.py: |
    """PyTorch GPU benchmark used for exclusive / time-slicing / MPS experiments."""

    import json
    import os
    import statistics
    import time

    import torch


    def main() -> None:
        matrix_size = int(os.environ.get("MATRIX_SIZE", "4096"))
        steps = int(os.environ.get("STEPS", "60"))
        warmup = int(os.environ.get("WARMUP", "5"))
        dtype_name = os.environ.get("DTYPE", "float32")
        dtype = {"float16": torch.float16, "float32": torch.float32, "bfloat16": torch.bfloat16}[dtype_name]

        assert torch.cuda.is_available(), "CUDA is not available inside this pod"

        device = torch.device("cuda:0")
        gpu_name = torch.cuda.get_device_name(0)
        total_mem_gb = torch.cuda.get_device_properties(0).total_memory / 1024**3

        print(f"gpu_name={gpu_name}")
        print(f"total_memory_gb={total_mem_gb:.2f}")
        print(f"matrix_size={matrix_size} steps={steps} warmup={warmup} dtype={dtype_name}")

        a = torch.randn(matrix_size, matrix_size, device=device, dtype=dtype)
        b = torch.randn(matrix_size, matrix_size, device=device, dtype=dtype)

        for _ in range(warmup):
            c = torch.matmul(a, b)
        torch.cuda.synchronize()

        torch.cuda.reset_peak_memory_stats(device)
        durations = []
        start_wall = time.time()
        for step in range(steps):
            t0 = time.time()
            c = torch.matmul(a, b)
            torch.cuda.synchronize()
            durations.append(time.time() - t0)
            if (step + 1) % 10 == 0:
                print(f"step={step + 1}/{steps} last_step_sec={durations[-1]:.4f}")
        wall = time.time() - start_wall

        peak_mem_gb = torch.cuda.max_memory_allocated(device) / 1024**3

        summary = {
            "gpu_name": gpu_name,
            "total_memory_gb": round(total_mem_gb, 3),
            "matrix_size": matrix_size,
            "steps": steps,
            "dtype": dtype_name,
            "total_wall_sec": round(wall, 4),
            "avg_step_sec": round(statistics.mean(durations), 6),
            "min_step_sec": round(min(durations), 6),
            "max_step_sec": round(max(durations), 6),
            "stdev_step_sec": round(statistics.pstdev(durations), 6),
            "peak_cuda_mem_gb": round(peak_mem_gb, 4),
        }

        print("RESULT_JSON=" + json.dumps(summary))


    if __name__ == "__main__":
        main()
